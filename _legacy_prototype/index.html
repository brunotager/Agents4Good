<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SSD Application Agent</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <!-- Drawer Overlay -->
        <div class="drawer-overlay" id="drawerOverlay"></div>

        <!-- Side Drawer -->
        <nav class="side-drawer" id="sideDrawer">
            <div class="drawer-header">Application Sections</div>
            <ul class="drawer-list">
                <li class="drawer-item"><span class="status-dot complete"></span> Personal Info</li>
                <li class="drawer-item"><span class="status-dot partial"></span> Medical History</li>
                <li class="drawer-item"><span class="status-dot unanswered"></span> Work History</li>
            </ul>
        </nav>

        <!-- Trust Badge -->
        <header class="trust-badge">
            <svg class="icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M12 1L3 5V11C3 16.55 6.84 21.74 12 23C17.16 21.74 21 16.55 21 11V5L12 1ZM12 7C13.66 7 15 8.34 15 10V11H16C16.55 11 17 11.45 17 12V18C17 18.55 16.55 19 16 19H8C7.45 19 7 18.55 7 18V12C7 11.45 7.45 11 8 11H9V10C9 8.34 10.34 7 12 7ZM12 9C11.45 9 11 9.45 11 10V11H13V10C13 9.45 12.55 9 12 9Z" fill="#003366"/>
            </svg>
            Your information is secure
        </header>

        <!-- Progress Tracking -->
        <div class="progress-container">
            <div class="progress-header">
                <button class="menu-btn" id="menuBtn" aria-label="Open Menu">
                    <svg viewBox="0 0 24 24" class="icon-solid">
                        <path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/>
                    </svg>
                </button>
                <div class="progress-text">35% Complete</div>
            </div>
            <div class="progress-bar-track">
                <div class="progress-segment complete" style="width: 35%;"></div>
                <div class="progress-segment partial" style="width: 15%;"></div>
                <div class="progress-segment unanswered" style="width: 50%;"></div>
            </div>
            <div class="progress-legend">
                <span class="legend-item"><span class="status-dot complete"></span>Complete</span>
                <span class="legend-item"><span class="status-dot partial"></span>Semi-answered</span>
                <span class="legend-item"><span class="status-dot unanswered"></span>Unanswered</span>
            </div>
        </div>

        <!-- Chat Area -->
        <main class="chat-area" id="chatArea">
            <div class="message agent-message">
                <div class="avatar-container">
                    <div class="avatar-pulse"></div>
                    <img src="https://ui-avatars.com/api/?name=Agent&background=003366&color=fff&rounded=true" alt="Agent Avatar" class="avatar">
                </div>
                <div class="message-bubble">
                    I am saving your medical history to Section 4. When did you last work?
                </div>
            </div>
        </main>

        <!-- Input Area -->
        <footer class="input-area">
            <div class="input-group">
                <label for="lastWorkDate" class="persistent-label">Last Date of Work</label>
                <div class="input-wrapper">
                    <input type="text" id="lastWorkDate" class="user-input" placeholder="e.g. March 2023" autocomplete="off">
                    <button class="voice-btn" id="voiceBtn" aria-label="Start Voice Input">
                        <svg viewBox="0 0 24 24" class="icon-solid voice-icon">
                            <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5-3c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
                        </svg>
                    </button>
                </div>
            </div>
            <button class="primary-action" id="nextButton" disabled>Next</button>
        </footer>
    </div>
    <script src="app.js"></script>
</body>
</html>
